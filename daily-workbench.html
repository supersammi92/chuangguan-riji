<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>小六一的闯关日记</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff9a56">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="闯关日记">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff8f0;--card:#fff;--accent:#ff9a56;--accent2:#ff6b6b;--green:#4ecdc4;--gold:#ffd700;--text:#3d3d3d;--sub:#888;--shadow:0 2px 12px rgba(0,0,0,.06);--radius:16px}
body{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;padding:0 0 80px;overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.top-bar{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#ff9a56,#ff6b6b);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 16px rgba(255,106,86,.3)}
.top-bar h1{font-size:17px;font-weight:700}
.coin-display{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.25);padding:6px 14px;border-radius:20px;font-weight:700;font-size:15px;backdrop-filter:blur(10px)}
.coin-display .coin-icon{font-size:20px;animation:coinPulse 2s infinite}
@keyframes coinPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.page{display:none;padding:12px 14px;animation:fadeIn .3s ease}.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:#fff;display:flex;justify-content:space-around;padding:6px 4px 8px;box-shadow:0 -2px 16px rgba(0,0,0,.08);border-radius:20px 20px 0 0}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;cursor:pointer;padding:6px 8px;color:#bbb;font-size:10px;font-family:inherit;transition:all .2s;position:relative;min-width:0;flex:1}
.nav-item .ni-icon{font-size:22px;transition:transform .2s}
.nav-item.active{color:var(--accent)}.nav-item.active .ni-icon{transform:scale(1.15)}
.nav-item .ni-badge{position:absolute;top:0;right:calc(50% - 22px);background:var(--accent2);color:#fff;font-size:9px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center}
/* Pet Page */
.pet-area{text-align:center;padding:20px 0}
.pet-stage{position:relative;width:200px;height:200px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.pet-emoji{font-size:120px;transition:transform .3s;cursor:pointer}
.pet-emoji:hover{transform:scale(1.08)}
.pet-emoji.eating{animation:eatAnim .3s ease 3}@keyframes eatAnim{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.pet-emoji.playing{animation:playAnim .5s ease 3}@keyframes playAnim{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.pet-emoji.crying{animation:cryAnim .4s ease 3}@keyframes cryAnim{0%,100%{transform:scale(1)}25%{transform:scale(1.1) rotate(-5deg)}75%{transform:scale(1.1) rotate(5deg)}}
.pet-name{font-size:18px;font-weight:700;margin-bottom:12px;color:var(--accent)}
.stat-row{display:flex;align-items:center;gap:10px;margin:8px 0;padding:0 20px}
.stat-label{font-size:13px;width:36px;text-align:right;flex-shrink:0}
.stat-bar{flex:1;height:12px;background:#f0f0f0;border-radius:6px;overflow:hidden}
.stat-fill{height:100%;border-radius:6px;transition:width .5s ease}
.stat-fill.hunger{background:linear-gradient(90deg,#ff6b6b,#ff9a56)}
.stat-fill.happiness{background:linear-gradient(90deg,#ffd700,#ffb347)}
.stat-fill.health{background:linear-gradient(90deg,#4ecdc4,#44a08d)}
.stat-fill.clean{background:linear-gradient(90deg,#a3c9ff,#6b9fff)}
.pet-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px 0}
.pet-btn{background:#fff;border:2px solid #eee;border-radius:20px;padding:8px 16px;font-size:14px;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;gap:6px}
.pet-btn:active{transform:scale(.95)}
.pet-btn .cost{font-size:11px;color:var(--accent);font-weight:700}
.pet-btn:disabled{opacity:.4;pointer-events:none}
.pet-select{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px 0}
.pet-option{width:70px;height:90px;border-radius:16px;border:3px solid #eee;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:36px;transition:all .2s;font-family:inherit}
.pet-option:hover,.pet-option.selected{border-color:var(--accent);background:#fff8f0}
.pet-option span{font-size:11px;color:var(--text)}
.add-pet-btn{background:linear-gradient(135deg,#ff9a56,#ff6b6b);color:#fff;border:none;border-radius:20px;padding:10px 24px;font-size:14px;cursor:pointer;font-family:inherit;font-weight:700;margin-top:8px}
/* Notification Toast */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:rgba(0,0,0,.85);color:#fff;padding:16px 32px;border-radius:24px;font-size:18px;font-weight:700;z-index:300;transition:transform .3s cubic-bezier(.175,.885,.32,1.275);pointer-events:none;text-align:center}
.toast.show{transform:translate(-50%,-50%) scale(1)}
.toast.penalty{background:rgba(255,107,107,.9)}
/* Task Page */
.task-list{display:flex;flex-direction:column;gap:10px}
.task-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .15s}
.task-card:active{transform:scale(.98)}
.task-card.done{opacity:.6;background:#f5fdf5}
.task-card .tc-icon{font-size:32px;flex-shrink:0}
.task-card .tc-info{flex:1;min-width:0}
.task-card .tc-name{font-size:15px;font-weight:600}
.task-card .tc-coin{font-size:12px;color:var(--accent);margin-top:2px}
.task-card .tc-check{font-size:24px;color:var(--green)}
/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding:20px;animation:slideUp .35s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-box h3{font-size:18px;margin-bottom:16px;text-align:center}
.modal-close{position:absolute;right:16px;top:16px;background:none;border:none;font-size:24px;cursor:pointer;padding:4px}
/* Exercise */
.exercise-area{text-align:center;padding:20px 0}
.ex-big{font-size:64px;margin-bottom:16px}
.ex-question{font-size:20px;margin-bottom:20px;font-weight:600}
.ex-options{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.ex-opt{padding:12px 20px;background:#f5f5f5;border:2px solid #e0e0e0;border-radius:14px;font-size:18px;cursor:pointer;font-family:inherit;transition:all .15s;min-width:60px}
.ex-opt:active{transform:scale(.95)}
.ex-opt.correct{background:#d4edda;border-color:#4caf50;animation:popIn .3s ease}
.ex-opt.wrong{background:#f8d7da;border-color:#f44336;animation:shake .4s ease}
@keyframes popIn{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ex-feedback{font-size:28px;margin-top:16px;min-height:40px}
.ex-score{font-size:14px;color:var(--sub);margin-top:8px}
/* Math numpad */
.numpad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:280px;margin:12px auto}
.numpad button{padding:14px;font-size:20px;border:2px solid #e0e0e0;border-radius:12px;background:#fff;cursor:pointer;font-family:inherit;transition:all .15s}
.numpad button:active{transform:scale(.93);background:#f0f0f0}
.numpad .np-submit{background:var(--accent);color:#fff;border-color:var(--accent);grid-column:span 2;font-weight:700}
.numpad .np-del{grid-column:span 2;background:#f5f5f5}
/* Shop */
.shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shop-item{background:var(--card);border-radius:var(--radius);padding:14px 10px;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.shop-item:active{transform:scale(.95)}
.shop-item .si-icon{font-size:36px;margin-bottom:6px}
.shop-item .si-name{font-size:13px;font-weight:600;margin-bottom:4px}
.shop-item .si-cost{font-size:11px;color:var(--accent);font-weight:700}
.shop-item .si-effect{font-size:10px;color:var(--sub)}
/* Wishes */
.wish-header{text-align:center;padding:16px 0;background:linear-gradient(135deg,#ffd700,#ffb347);border-radius:var(--radius);color:#fff;margin-bottom:14px}
.wish-header .wh-coins{font-size:40px;font-weight:800;margin-bottom:4px}
.wish-header .wh-label{font-size:13px;opacity:.9}
.wish-list{display:flex;flex-direction:column;gap:10px}
.wish-item{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.wish-item .wi-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.wish-item .wi-name{font-size:15px;font-weight:600}
.wish-item .wi-cost{font-size:13px;color:var(--accent);font-weight:700}
.wish-bar{height:10px;background:#f0f0f0;border-radius:5px;overflow:hidden}
.wish-fill{height:100%;background:linear-gradient(90deg,#ffd700,#ff9a56);border-radius:5px;transition:width .5s ease}
.wish-actions{margin-top:8px;display:flex;gap:8px;justify-content:flex-end}
.wish-actions button{padding:6px 14px;border-radius:14px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:12px;font-family:inherit}
.wish-actions .wa-claim{background:var(--accent);color:#fff;border-color:var(--accent)}
/* Report */
.report-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:10px}
.report-card h4{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.report-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid #f5f5f5}
.report-row:last-child{border:none}
.report-total{font-size:18px;font-weight:700;text-align:center;padding:12px;color:var(--accent);margin-top:8px}
/* Parent Page */
.parent-lock{text-align:center;padding:60px 20px}
.parent-lock input{width:200px;padding:12px;border-radius:12px;border:2px solid #ddd;font-size:18px;text-align:center;font-family:inherit;margin-bottom:12px}
.parent-lock button{padding:10px 30px;background:var(--accent);color:#fff;border:none;border-radius:16px;font-size:15px;cursor:pointer;font-family:inherit}
.parent-content{display:none}
.parent-content.show{display:block}
.parent-section{margin-bottom:16px}
.parent-section h4{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.config-item{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.config-item .ci-info{flex:1;min-width:0;font-size:13px}
.config-item .ci-info strong{display:block;margin-bottom:2px}
.config-item .ci-input{width:60px;padding:6px;border-radius:8px;border:1px solid #ddd;font-size:14px;text-align:center;font-family:inherit}
.config-item .ci-del{background:none;border:none;font-size:18px;cursor:pointer;padding:4px;color:#ccc}
.add-config-btn{width:100%;padding:10px;border:2px dashed #ddd;border-radius:12px;background:none;font-size:14px;cursor:pointer;font-family:inherit;color:var(--sub);margin-top:8px}
.add-config-btn:hover{border-color:var(--accent);color:var(--accent)}
/* Section title */
.section-title{font-size:14px;font-weight:700;color:var(--sub);margin:16px 0 8px;display:flex;align-items:center;gap:6px}
/* Pet crying overlay */
.cry-effect{position:fixed;inset:0;pointer-events:none;z-index:150;display:none}
.cry-effect.show{display:flex;align-items:center;justify-content:center}
.cry-effect .cry-emoji{font-size:100px;animation:cryBig .6s ease}
@keyframes cryBig{0%{transform:scale(0);opacity:1}50%{transform:scale(1.3);opacity:1}100%{transform:scale(1);opacity:0}}
/* Safe area */
@supports(padding:max(0px)){.bottom-nav{padding-bottom:max(8px,env(safe-area-inset-bottom))}}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="top-bar" id="topBar">
  <h1 id="topTitle">🐾 小伙伴</h1>
  <div class="coin-display"><span class="coin-icon">🪙</span><span id="coinCount">0</span></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Cry Effect Overlay -->
<div class="cry-effect" id="cryOverlay"><span class="cry-emoji">😭</span></div>

<!-- ========== PAGE: 小伙伴 ========== -->
<div class="page active" id="page-pet">
  <div class="pet-select" id="petSelect"></div>
  <div id="petStage">
    <div class="pet-area">
      <div class="pet-stage"><span class="pet-emoji" id="petEmoji">🐰</span></div>
      <div class="pet-name" id="petName">请选择小伙伴</div>
      <div id="petStats" style="display:none">
        <div class="stat-row"><span class="stat-label">🍽️</span><div class="stat-bar"><div class="stat-fill hunger" id="statHunger" style="width:80%"></div></div></div>
        <div class="stat-row"><span class="stat-label">😊</span><div class="stat-bar"><div class="stat-fill happiness" id="statHappiness" style="width:80%"></div></div></div>
        <div class="stat-row"><span class="stat-label">❤️</span><div class="stat-bar"><div class="stat-fill health" id="statHealth" style="width:80%"></div></div></div>
        <div class="stat-row"><span class="stat-label">🚿</span><div class="stat-bar"><div class="stat-fill clean" id="statClean" style="width:80%"></div></div></div>
      </div>
    </div>
    <div class="pet-actions" id="petActions">
      <button class="pet-btn" onclick="petAction('feed')"><span>🍎</span>喂食<span class="cost">🪙2</span></button>
      <button class="pet-btn" onclick="petAction('play')"><span>🎾</span>陪玩<span class="cost">🪙1</span></button>
      <button class="pet-btn" onclick="petAction('heal')"><span>💊</span>治病<span class="cost">🪙3</span></button>
      <button class="pet-btn" onclick="petAction('bath')"><span>🛁</span>洗澡<span class="cost">🪙1</span></button>
    </div>
  </div>
</div>

<!-- ========== PAGE: 任务 ========== -->
<div class="page" id="page-task">
  <div class="task-list" id="taskList"></div>
</div>

<!-- ========== PAGE: 商店 ========== -->
<div class="page" id="page-shop">
  <div class="shop-grid" id="shopGrid"></div>
</div>

<!-- ========== PAGE: 心愿 ========== -->
<div class="page" id="page-wish">
  <div class="wish-header">
    <div class="wh-coins" id="wishCoins">0</div>
    <div class="wh-label">🪙 我的金币</div>
  </div>
  <div class="wish-list" id="wishList"></div>
  <button class="add-config-btn" onclick="addCustomWish()" style="margin-top:12px">+ 自定义心愿</button>
</div>

<!-- ========== PAGE: 报告 ========== -->
<div class="page" id="page-report">
  <div id="reportContent"></div>
</div>

<!-- ========== PAGE: 家长 ========== -->
<div class="page" id="page-parent">
  <div class="parent-lock" id="parentLock">
    <h3>🔐 家长验证</h3>
    <p style="color:var(--sub);font-size:13px;margin:8px 0">请输入密码</p>
    <input type="password" id="parentPassword" placeholder="输入密码" maxlength="6">
    <br><button onclick="unlockParent()">确认</button>
    <p style="color:#ccc;font-size:11px;margin-top:8px">默认密码: 1234</p>
  </div>
  <div class="parent-content" id="parentContent">
    <div class="parent-section">
      <h4>🔑 修改密码</h4>
      <div style="display:flex;gap:8px">
        <input type="password" id="newPassword" placeholder="新密码" class="ci-input" style="flex:1;width:auto" maxlength="6">
        <button onclick="changePassword()" style="padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:12px;cursor:pointer;font-family:inherit">保存</button>
      </div>
    </div>
    <div class="section-title">📋 任务（完成获得金币奖励）</div>
    <div id="configTasks"></div>
    <button class="add-config-btn" onclick="addConfigTask()">+ 添加任务</button>
    <div class="section-title">⚠️ 扣分项（触发扣除金币）</div>
    <div id="configPenalties"></div>
    <button class="add-config-btn" onclick="addConfigPenalty()">+ 添加扣分项</button>
    <div class="section-title">🏪 商店商品</div>
    <div id="configShopItems"></div>
    <button class="add-config-btn" onclick="addConfigShopItem()">+ 添加商品</button>
    <div class="section-title">🌟 心愿</div>
    <div id="configWishes"></div>
    <button class="add-config-btn" onclick="addConfigWish()">+ 添加心愿</button>
  </div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav" id="bottomNav">
  <button class="nav-item active" data-page="pet"><span class="ni-icon">🐾</span>小伙伴</button>
  <button class="nav-item" data-page="task"><span class="ni-icon">📋</span>任务</button>
  <button class="nav-item" data-page="shop"><span class="ni-icon">🏪</span>商店</button>
  <button class="nav-item" data-page="wish"><span class="ni-icon">🌟</span>心愿</button>
  <button class="nav-item" data-page="report"><span class="ni-icon">📊</span>报告</button>
  <button class="nav-item" data-page="parent"><span class="ni-icon">⚙️</span>家长</button>
</div>

<!-- Exercise Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox">
    <div id="modalContent"></div>
  </div>
</div>

<script>
// ============================================================
// AUDIO CONTEXT - Sound Effects
// ============================================================
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playTone(freq,dur,type='sine',vol=.15){
  initAudio();const o=audioCtx.createOscillator();const g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);
  g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
}
function sfxEat(){playTone(400,.1);setTimeout(()=>playTone(500,.1),100);setTimeout(()=>playTone(300,.1),200)}
function sfxHappy(){playTone(523,.12);setTimeout(()=>playTone(659,.12),120);setTimeout(()=>playTone(784,.15),240)}
function sfxCry(){playTone(300,.2,'square',.08);setTimeout(()=>playTone(250,.3,'square',.08),200)}
function sfxCoin(){playTone(880,.08);setTimeout(()=>playTone(1100,.1),80)}
function sfxPenalty(){playTone(200,.3,'sawtooth',.1)}
function sfxWater(){playTone(600,.05,'triangle',.05);setTimeout(()=>playTone(500,.05,'triangle',.05),50);setTimeout(()=>playTone(550,.05,'triangle',.05),100);setTimeout(()=>playTone(450,.05,'triangle',.05),150)}

// ============================================================
// DATA MODEL & PERSISTENCE
// ============================================================
const STORAGE_KEY='workbench_v4';
const DEFAULT_STATE={
  coins:20,
  pets:[],
  activePetIdx:0,
  completedTasks:{},
  dailyPenalties:{},
  shopHistory:{},
  wishProgress:{},
  parentPin:'1234',
  config:{
    tasks:[
      {id:'t1',name:'🔤 识字小达人',cat:'study',coins:4,difficulty:'中等'},
      {id:'t2',name:'🔢 数学大冒险',cat:'study',coins:4,difficulty:'中等'},
      {id:'t3',name:'📚 英语探险家',cat:'study',coins:5,difficulty:'较难'},
      {id:'t4',name:'🧠 思维小天才',cat:'study',coins:5,difficulty:'较难'},
      {id:'t5',name:'⚫ 围棋小棋手',cat:'game',coins:3,difficulty:'简单'},
      {id:'t6',name:'⚡ 运动小健将',cat:'sport',coins:3,difficulty:'简单'},
      {id:'t7',name:'📖 阅读小书虫',cat:'habit',coins:3,difficulty:'简单'},
    ],
    penalties:[
      {id:'p1',name:'📺 超时看电视',coins:4},
      {id:'p2',name:'📝 未完成作业',coins:5},
      {id:'p3',name:'🤥 欺骗/说谎',coins:5},
      {id:'p4',name:'🐌 拖延不做事',coins:3},
    ],
    shopItems:[

function loadState(){
  try{const d=localStorage.getItem(STORAGE_KEY);if(d){const s=JSON.parse(d);return deepMerge(JSON.parse(JSON.stringify(DEFAULT_STATE)),s)}}catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function deepMerge(base,overlay){for(const k in overlay){if(overlay[k]&&typeof overlay[k]==='object'&&!Array.isArray(overlay[k])){base[k]=deepMerge(base[k]||{},overlay[k])}else{base[k]=overlay[k]}}return base}

// Today key
function todayKey(){return new Date().toISOString().slice(0,10)}
function today(){return todayKey()}
// Week key
function weekKey(){const d=new Date();d.setDate(d.getDate()-d.getDay());return d.toISOString().slice(0,10)}

function getActivePet(){return state.pets[state.activePetIdx]||null}
function createPet(type,name){
  return{id:Date.now().toString(36),type,name,hunger:80,happiness:80,health:100,clean:100,
    lastFed:0,lastPlayed:0,lastHealed:0,lastBathed:0,created:Date.now()};
}

// Time decay - lose ~2 points per hour of inactivity
function applyDecay(pet){
  const now=Date.now(),h=3600000;
  if(pet.lastFed>0)pet.hunger=Math.max(0,pet.hunger-Math.floor((now-pet.lastFed)/h*.8));
  if(pet.lastPlayed>0)pet.happiness=Math.max(0,pet.happiness-Math.floor((now-pet.lastPlayed)/h*.6));
  if(pet.lastHealed>0)pet.health=Math.max(0,pet.health-Math.floor((now-pet.lastHealed)/h*.3));
  if(pet.lastBathed>0)pet.clean=Math.max(0,pet.clean-Math.floor((now-pet.lastBathed)/h*.5));
}

function petAction(type){
  const pet=getActivePet();
  if(!pet)return toastMsg('请先选择小伙伴!🐾');
  const costs={feed:2,play:1,heal:3,bath:1};
  const cost=costs[type];
  if(state.coins<cost)return toastMsg('金币不够啦!🪙',true);

  state.coins-=cost;
  const now=Date.now();
  const boosts={feed:[20,'hunger','lastFed'],play:[20,'happiness','lastPlayed'],
                heal:[35,'health','lastHealed'],bath:[35,'clean','lastBathed']};
  const[boost,stat,timeKey]=boosts[type];
  pet[stat]=Math.min(100,pet[stat]+boost);
  pet[timeKey]=now;

  const petEmoji=document.getElementById('petEmoji');
  const anims={feed:'eating',play:'playing',bath:'eating'};
  if(anims[type]){petEmoji.classList.add(anims[type]);setTimeout(()=>petEmoji.classList.remove(anims[type]),1200)}

  const sfxMap={feed:sfxEat,play:sfxHappy,heal:sfxHappy,bath:sfxWater};
  (sfxMap[type])();
  const msgs={feed:'好吃好吃!😋',play:'好开心!🎉',heal:'好多了!💪',bath:'香喷喷!✨'};
  toastMsg(msgs[type]);

  saveState();renderPetPage();updateCoinDisplay();
}

function triggerPenalty(penaltyId){
  const p=state.config.penalties.find(x=>x.id===penaltyId);
  if(!p)return;
  state.coins=Math.max(0,state.coins-p.coins);
  const key=today();
  if(!state.dailyPenalties[key])state.dailyPenalties[key]=[];
  state.dailyPenalties[key].push({id:penaltyId,time:Date.now()});

  sfxCry();
  document.getElementById('cryOverlay').classList.add('show');
  setTimeout(()=>document.getElementById('cryOverlay').classList.remove('show'),1000);
  toastMsg(`${p.name.split(' ')[1]||p.name} — 扣${p.coins}🪙 呜呜~😭`,true);

  saveState();renderPetPage();updateCoinDisplay();
}

function selectPetType(type){
  const sel=document.querySelectorAll('.pet-option');

function addPet(){
  const sel=document.querySelector('.pet-option.selected');
  if(!sel)return toastMsg('请先点击选择一个宠物!',true);
  const type=Object.keys(PET_TYPES).find(k=>PET_TYPES[k].name===sel.querySelector('span').textContent);
  if(!type)return;
  // Check if already have this type (allow if user wants)
  const existing=state.pets.find(p=>p.type===type);
  if(existing)return toastMsg('你已经有这个伙伴啦!');
  const name=prompt('给你的小伙伴起个名字吧!',PET_TYPES[type].name);
  if(name===null)return;
  const pet=createPet(type,name||PET_TYPES[type].name);
  state.pets.push(pet);
  state.activePetIdx=state.pets.length-1;
  saveState();renderPetPage();
  sfxHappy();toastMsg('欢迎新伙伴!🎉');
}

  if(op==='+')ans=a+b;else{if(a<b)[a,b]=[b,a];ans=a-b}
  exState={correct:ans,task,total:0,correctCount:0,rounds:6};
  return `<div class="exercise-area">
    <h3>🔢 数学大冒险</h3><p style="color:var(--sub);margin-bottom:8px">第1/${exState.rounds}题</p>

function answerEx(choice){
  exState.total++;
  const fb=document.getElementById('exFeedback');
  const sc=document.getElementById('exScore');
  const isCorrect=choice===exState.correct;

  if(isCorrect){exState.correctCount++;fb.textContent='✅ 答对了!';playTone(600,.1);playTone(800,.15)}
  else{fb.textContent='❌ 再想想~';playTone(250,.2,'square',.05)}
  sc.textContent=`正确: ${exState.correctCount}/${exState.total}`;

  // Highlight options
  const opts=document.querySelectorAll('.ex-modal-btn');
  if(!opts.length){
    document.querySelectorAll('.ex-opt').forEach(o=>{
      if(o.textContent.trim()===choice||o.textContent===choice){
        if(isCorrect)o.classList.add('correct');else o.classList.add('wrong');
      }
    });
  }

  setTimeout(()=>{
    if(exState.task.id==='t5'){
      exState.currentRound++;renderGoContinue();
    }else{
      continueChineseOrGeneral();
    }
  },1000);
}

function continueChineseOrGeneral(){
  exState.currentRound=(exState.currentRound||0)+1;
  if(exState.currentRound>=exState.rounds){finishEx();return}

  // Generate next question based on task type
  if(exState.task.id==='t1')regenerateChinese();
  else if(exState.task.id==='t3')regenerateEnglish();
  else if(exState.task.id==='t4')regenerateThinking();
  else if(exState.task.id==='t2')regenerateMath();
}

function regenerateChinese(){
  const pairs=[['🐱','猫'],['🐶','狗'],['🐰','兔'],['🐟','鱼'],['🐦','鸟'],['🐴','马'],['🐮','牛'],['🐑','羊'],['🌙','月'],['⭐','星'],['🌊','海'],['🏔️','山'],['🌳','树'],['🌸','花'],['🌞','日'],['🚗','车'],['🚢','船'],['✈️','机'],['🍎','果'],['📖','书']];
  const q=pairs[Math.floor(Math.random()*pairs.length)];
  const wrong=pairs.filter(p=>p[1]!==q[1]).sort(()=>Math.random()-.5).slice(0,3);
  const opts=[q[1],...wrong.map(p=>p[1])].sort(()=>Math.random()-.5);
  exState.correct=q[1];
  document.querySelector('.ex-big').textContent=q[0];
  document.querySelectorAll('.ex-opt').forEach((o,i)=>{o.textContent=opts[i];o.className='ex-opt'});
  document.querySelector('.modal-box p').textContent=`第${exState.currentRound+1}/${exState.rounds}题`;
  document.getElementById('exFeedback').textContent='';
}

function regenerateEnglish(){
  const words=[['apple','🍎','苹果'],['cat','🐱','猫'],['dog','🐶','狗'],['fish','🐟','鱼'],['bird','🐦','鸟'],['star','⭐','星星'],['moon','🌙','月亮'],['car','🚗','车'],['book','📖','书'],['flower','🌸','花'],['sun','🌞','太阳'],['tree','🌳','树']];
  const q=words[Math.floor(Math.random()*words.length)];
  const wrong=words.filter(w=>w[0]!==q[0]).sort(()=>Math.random()-.5).slice(0,3);
  const opts=[q[0],...wrong.map(w=>w[0])].sort(()=>Math.random()-.5);
  exState.correct=q[0];
  document.querySelector('.ex-big').textContent=q[1];
  document.querySelector('.ex-question').textContent=q[2]+' — 选英文单词';
  document.querySelectorAll('.ex-opt').forEach((o,i)=>{o.textContent=opts[i];o.className='ex-opt'});
  document.querySelector('.modal-box p').textContent=`第${exState.currentRound+1}/${exState.rounds}题`;
  document.getElementById('exFeedback').textContent='';
}

function regenerateThinking(){
  const patterns=[{q:'🔴🟡🔴🟡🔴❓',opts:['🟡','🔴','🟢'],ans:'🟡'},{q:'🔺🔻🔺🔻❓',opts:['🔻','🔺','◼️'],ans:'🔺'},{q:'🐱🐶🐱🐶🐱❓',opts:['🐶','🐱','🐰'],ans:'🐶'},{q:'🍎🍌🍎🍌🍎❓',opts:['🍌','🍎','🍇'],ans:'🍌'}];
  const q=patterns[Math.floor(Math.random()*patterns.length)];
  exState.correct=q.ans;
  document.querySelector('.ex-big').textContent=q.q;
  document.querySelectorAll('.ex-opt').forEach((o,i)=>{o.textContent=q.opts[i];o.className='ex-opt'});
  document.querySelector('.modal-box p').textContent=`第${exState.currentRound+1}/${exState.rounds}题`;
  document.getElementById('exFeedback').textContent='';
}

function regenerateMath(){
  const a=Math.floor(Math.random()*10)+1;const b=Math.floor(Math.random()*10)+1;
  const op=Math.random()>.5?'+':'-';let ans;
  if(op==='+')ans=a+b;else{if(a<b)[a,b]=[b,a];ans=a-b}
  exState.correct=String(ans);
  const container=document.querySelector('.ex-big');
  if(container)container.textContent=`${a} ${op} ${b} = ?`;
  const inp=document.getElementById('mathInput');if(inp)inp.value='';
  document.querySelector('.modal-box p').textContent=`第${exState.currentRound+1}/${exState.rounds}题`;
  document.getElementById('exFeedback').textContent='';
}

function renderGoContinue(){
  document.getElementById('modalContent').innerHTML=renderGoRound();
}

function finishEx(){
  const tk=today();
  const ratio=exState.correctCount/exState.total;
  if(ratio>=0.5){
    state.completedTasks[tk][exState.task.id]=true;
    state.coins+=exState.task.coins;
    sfxCoin();
    document.getElementById('modalContent').innerHTML=`
      <div class="exercise-area"><div class="ex-big">🎉</div>
      <h3>任务完成!</h3><p>答对 ${exState.correctCount}/${exState.total} 题</p>
      <p style="font-size:24px;color:var(--accent);font-weight:700">+${exState.task.coins}🪙</p>
      <button onclick="closeModal()" style="margin-top:16px;padding:10px 30px;background:var(--accent);color:#fff;border:none;border-radius:16px;font-size:15px;cursor:pointer;font-family:inherit">✅ 收下奖励</button></div>`;
  }else{
    document.getElementById('modalContent').innerHTML=`
      <div class="exercise-area"><div class="ex-big">😅</div>
      <h3>还要再练练哦</h3><p>答对 ${exState.correctCount}/${exState.total} 题</p>
      <p style="color:var(--sub)">需要答对一半以上才能获得金币</p>
      <button onclick="closeModal();startTask('${exState.task.id}')" style="margin-top:16px;padding:10px 30px;background:var(--accent2);color:#fff;border:none;border-radius:16px;font-size:15px;cursor:pointer;font-family:inherit">🔄 再来一次</button></div>`;
  }
  saveState();renderTaskPage();updateCoinDisplay();renderReportPage();
}

// ============================================================
// SHOP SYSTEM
// ============================================================
function renderShopPage(){
  document.getElementById('shopGrid').innerHTML=state.config.shopItems.map(s=>`
    <div class="shop-item" onclick="buyItem('${s.id}')">
      <div class="si-icon">${s.icon}</div>
      <div class="si-name">${s.name}</div>
      <div class="si-effect">${s.desc||''}</div>
      <div class="si-cost">🪙${s.cost}</div>
    </div>`).join('');
}

function buyItem(itemId){
  const item=state.config.shopItems.find(s=>s.id===itemId);
  if(!item)return;
  if(state.coins<item.cost)return toastMsg('金币不够啦!🪙',true);
  const pet=getActivePet();
  if(!pet)return toastMsg('请先选择小伙伴!');
  state.coins-=item.cost;
  pet[item.effect]=Math.min(100,pet[item.effect]+item.val);
  const key=today();
  if(!state.shopHistory[key])state.shopHistory[key]=[];
  state.shopHistory[key].push({item:itemId,time:Date.now()});
  sfxEat();
  const petEmoji=document.getElementById('petEmoji');
  petEmoji.classList.add('eating');
  setTimeout(()=>petEmoji.classList.remove('eating'),1200);
  toastMsg(`${item.icon} 买了${item.name}!`);
  saveState();updateCoinDisplay();renderPetPage();
}

// ============================================================
// WISH SYSTEM
// ============================================================
function renderWishPage(){
  document.getElementById('wishCoins').textContent=state.coins;
  document.getElementById('wishList').innerHTML=state.config.wishes.map(w=>{
    const prog=state.wishProgress[w.id]||0;
    const pct=Math.min(100,Math.round(prog/w.cost*100));
    return `<div class="wish-item">
      <div class="wi-top"><span class="wi-name">${w.name}</span><span class="wi-cost">🪙${prog}/${w.cost}</span></div>
      <div class="wish-bar"><div class="wish-fill" style="width:${pct}%"></div></div>
      <div class="wish-actions">
        <button onclick="contributeWish('${w.id}',10)">+10🪙</button>
        <button onclick="contributeWish('${w.id}',50)">+50🪙</button>
        <button class="wa-claim" ${prog<w.cost||state.coins<w.cost-prog?'disabled':''} onclick="claimWish('${w.id}')">${prog>=w.cost?'✅ 兑换':'攒够了来换'}</button>
      </div></div>`;
  }).join('');
}

function contributeWish(wishId,amount){
  const w=state.config.wishes.find(x=>x.id===wishId);
  if(!w)return;
  const prog=state.wishProgress[wishId]||0;
  const remaining=w.cost-prog;
  const actual=Math.min(amount,remaining,state.coins);
  if(actual<=0)return toastMsg('已经攒够了!',true);
  state.coins-=actual;state.wishProgress[wishId]=(state.wishProgress[wishId]||0)+actual;
  sfxCoin();saveState();renderWishPage();updateCoinDisplay();
  if(state.wishProgress[wishId]>=w.cost)toastMsg('🌟 心愿达成!可以兑换了!');
}

function claimWish(wishId){
  const w=state.config.wishes.find(x=>x.id===wishId);
  if(!w)return;
  const prog=state.wishProgress[wishId]||0;
  if(prog<w.cost)return;
  state.wishProgress[wishId]=0;
  sfxHappy();toastMsg(`🎉 恭喜!${w.name} 已兑换!`);
  saveState();renderWishPage();
}

function addCustomWish(){
  const name=prompt('输入心愿名称:');
  if(!name||!name.trim())return;
  const cost=parseInt(prompt('需要多少金币? (建议80-200):','100'));
  if(isNaN(cost)||cost<1)return;
  const id='wc'+Date.now().toString(36);
  state.config.wishes.push({id,name:'✨ '+name.trim(),cost});
  saveState();renderWishPage();
}

// ============================================================
// REPORT SYSTEM
// ============================================================
function renderReportPage(){
  const tk=today();
  const ct=state.completedTasks[tk]||{};
  const pen=state.dailyPenalties[tk]||[];
  const shop=state.shopHistory[tk]||[];
  const completed=state.config.tasks.filter(t=>ct[t.id]);
  const earned=completed.reduce((s,t)=>s+t.coins,0);
  const penaltyTotal=pen.reduce((s,p)=>{
    const cfg=state.config.penalties.find(x=>x.id===p.id);
    return s+(cfg?cfg.coins:0);
  },0);
  const shopTotal=shop.reduce((s,sh)=>{
    const cfg=state.config.shopItems.find(x=>x.id===sh.item);
    return s+(cfg?cfg.cost:0);
  },0);

  document.getElementById('reportContent').innerHTML=`
    <div class="report-card">
      <h4>📋 今日任务</h4>
      ${state.config.tasks.map(t=>{
        const done=!!ct[t.id];
        return `<div class="report-row"><span>${done?'✅':'⬜'} ${t.name}</span><span style="color:${done?'var(--green)':'#ccc'}">${done?'+'+t.coins+'🪙':'---'}</span></div>`;
      }).join('')}
    </div>
    <div class="report-card">
      <h4>⚠️ 今日扣分</h4>
      ${pen.length===0?'<p style="color:var(--sub);font-size:13px;padding:8px 0">今天没有扣分，很棒!</p>':
        pen.map(p=>{const cfg=state.config.penalties.find(x=>x.id===p.id);
          return `<div class="report-row"><span>${cfg?cfg.name:'未知'}</span><span style="color:#ff6b6b">-${cfg?cfg.coins:'?'}🪙</span></div>`;
        }).join('')}
    </div>
    <div class="report-card">
      <h4>🏪 今日购物</h4>
      ${shop.length===0?'<p style="color:var(--sub);font-size:13px;padding:8px 0">今天还没买东西</p>':
        shop.map(sh=>{const cfg=state.config.shopItems.find(x=>x.id===sh.item);
          return `<div class="report-row"><span>${cfg?cfg.icon+' '+cfg.name:'物品'}</span><span style="color:var(--accent)">-${cfg?cfg.cost:'?'}🪙</span></div>`;
        }).join('')}
    </div>
    <div class="report-card"><div class="report-total">
      🪙 今日获得: <span style="color:var(--green)">+${earned}</span> &nbsp;
      花费: <span style="color:var(--accent)">-${penaltyTotal+shopTotal}</span> &nbsp;
      净变化: <span style="color:${earned-penaltyTotal-shopTotal>=0?'var(--green)':'var(--accent2)'}">${earned-penaltyTotal-shopTotal>=0?'+':''}${earned-penaltyTotal-shopTotal}</span>
    </div></div>`;
}

// ============================================================
// PARENT SETTINGS
// ============================================================
function unlockParent(){
  const pw=document.getElementById('parentPassword').value;
  if(pw!==state.parentPin)return toastMsg('密码错误!',true);
  document.getElementById('parentLock').style.display='none';
  document.getElementById('parentContent').classList.add('show');
  renderParentConfig();
}

function changePassword(){
  const np=document.getElementById('newPassword').value;
  if(!np||np.length<2)return toastMsg('密码太短!',true);
  state.parentPin=np;saveState();toastMsg('密码已修改!✅');
}

function renderParentConfig(){
  renderConfigList('configTasks',state.config.tasks,'t');
  renderConfigList('configPenalties',state.config.penalties,'p');
  renderConfigList('configShopItems',state.config.shopItems,'s');
  renderConfigList('configWishes',state.config.wishes,'w');
}

function renderConfigList(containerId,items,prefix){
  const container=document.getElementById(containerId);
  container.innerHTML=items.map((item,i)=>{
    if(prefix==='t'){
      return `<div class="config-item">
        <div class="ci-info"><strong>${item.name}</strong>难度:${item.difficulty||'--'}</div>
        <input class="ci-input" value="${item.coins}" onchange="updateConfigItem('${containerId}','${item.id}','coins',this.value)" type="number" min="1" max="20" style="width:55px">
        <span style="font-size:12px;color:var(--sub)">🪙</span>
        <button class="ci-del" onclick="removeConfigItem('${containerId}','${item.id}')">🗑️</button></div>`;
    }else if(prefix==='p'){
      return `<div class="config-item">
        <div class="ci-info"><strong>${item.name}</strong></div>
        <input class="ci-input" value="${item.coins}" onchange="updateConfigItem('${containerId}','${item.id}','coins',this.value)" type="number" min="1" max="20" style="width:55px">
        <span style="font-size:12px;color:#ff6b6b">🪙</span>
        <button class="ci-del" onclick="removeConfigItem('${containerId}','${item.id}')">🗑️</button></div>`;
    }else if(prefix==='s'){
      return `<div class="config-item">
        <div class="ci-info"><strong>${item.icon} ${item.name}</strong>${item.desc||''}</div>
        <input class="ci-input" value="${item.cost}" onchange="updateConfigItem('${containerId}','${item.id}','cost',this.value)" type="number" min="1" max="50" style="width:55px">
        <span style="font-size:12px;color:var(--sub)">🪙</span>
        <button class="ci-del" onclick="removeConfigItem('${containerId}','${item.id}')">🗑️</button></div>`;
    }else{
      return `<div class="config-item">
        <div class="ci-info"><strong>${item.name}</strong></div>
        <input class="ci-input" value="${item.cost}" onchange="updateConfigItem('${containerId}','${item.id}','cost',this.value)" type="number" min="10" max="500" style="width:55px">
        <span style="font-size:12px;color:var(--sub)">🪙</span>
        <button class="ci-del" onclick="removeConfigItem('${containerId}','${item.id}')">🗑️</button></div>`;
    }
  }).join('');
}

function updateConfigItem(containerId,itemId,field,value){
  const numVal=parseInt(value);if(isNaN(numVal)||numVal<1)return;
  let items;if(containerId==='configTasks')items=state.config.tasks;
  else if(containerId==='configPenalties')items=state.config.penalties;
  else if(containerId==='configShopItems')items=state.config.shopItems;
  else items=state.config.wishes;
  const item=items.find(x=>x.id===itemId);
  if(item){item[field]=numVal;saveState();renderAllPages()}
}

function removeConfigItem(containerId,itemId){
  let items;if(containerId==='configTasks')items=state.config.tasks;
  else if(containerId==='configPenalties')items=state.config.penalties;
  else if(containerId==='configShopItems')items=state.config.shopItems;
  else items=state.config.wishes;
  const idx=items.findIndex(x=>x.id===itemId);
  if(idx>=0){items.splice(idx,1);saveState();renderParentConfig();renderAllPages()}
}

function addConfigTask(){
  const name=prompt('任务名称(含emoji):','🧹 做家务');
  if(!name)return;
  const coins=parseInt(prompt('金币奖励:','4'));
  if(isNaN(coins))return;
  const diff=prompt('难度(简单/中等/较难):','简单');
  state.config.tasks.push({id:'t'+Date.now().toString(36),name,cat:'habit',coins,difficulty:diff||'简单'});
  saveState();renderParentConfig();renderAllPages();
}

function addConfigPenalty(){
  const name=prompt('扣分项名称(含emoji):','📺 超时看电视');
  if(!name)return;
  const coins=parseInt(prompt('扣除金币:','4'));
  if(isNaN(coins))return;
  state.config.penalties.push({id:'p'+Date.now().toString(36),name,coins});
  saveState();renderParentConfig();renderAllPages();
}

function addConfigShopItem(){
  const name=prompt('商品名称:','饼干');
  if(!name)return;
  const icon=prompt('emoji图标:','🍪');
  const cost=parseInt(prompt('价格(🪙):','3'));
  if(isNaN(cost))return;
  const effect=prompt('效果类型(hunger/happiness/health/clean):','hunger');
  const val=parseInt(prompt('效果值(1-50):','15'));
  state.config.shopItems.push({id:'s'+Date.now().toString(36),name,icon:icon||'🎁',cost,effect:effect||'hunger',val:isNaN(val)?15:val,desc:''});
  saveState();renderParentConfig();renderAllPages();
}

function addConfigWish(){
  const name=prompt('心愿名称:','🎮 买游戏');
  if(!name)return;
  const cost=parseInt(prompt('需要金币:','100'));
  if(isNaN(cost))return;
  state.config.wishes.push({id:'w'+Date.now().toString(36),name:'✨ '+name,cost});
  saveState();renderParentConfig();renderAllPages();
}

// ============================================================
// NAVIGATION
// ============================================================
function switchPage(pageName){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+pageName).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelector(`.nav-item[data-page="${pageName}"]`).classList.add('active');
  const titles={pet:'🐾 小伙伴',task:'📋 今日任务',shop:'🏪 宠物商店',wish:'🌟 心愿清单',report:'📊 今日日报',parent:'⚙️ 家长后台'};
  document.getElementById('topTitle').textContent=titles[pageName];

  if(pageName==='pet')renderPetPage();
  else if(pageName==='task')renderTaskPage();
  else if(pageName==='shop')renderShopPage();
  else if(pageName==='wish')renderWishPage();
  else if(pageName==='report')renderReportPage();
  else if(pageName==='parent'){
    document.getElementById('parentLock').style.display='block';
    document.getElementById('parentContent').classList.remove('show');
    document.getElementById('parentPassword').value='';
  }
}

// ============================================================
// UI HELPERS
// ============================================================
function toastMsg(msg,isPenalty=false){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast'+(isPenalty?' penalty':'');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

function updateCoinDisplay(){
  document.getElementById('coinCount').textContent=state.coins;
}

function renderAllPages(){
  renderTaskPage();
  renderShopPage();
  renderWishPage();
  renderReportPage();
}

// ============================================================
// BOTTOM NAV CLICKS
// ============================================================
document.getElementById('bottomNav').addEventListener('click',(e)=>{
  const btn=e.target.closest('.nav-item');
  if(!btn)return;switchPage(btn.dataset.page);
});

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click',(e)=>{
  if(e.target===document.getElementById('modalOverlay'))closeModal();
});

// ============================================================
// INIT
// ============================================================
function init(){
  // Ensure today's task state exists
  const tk=today();
  if(!state.completedTasks[tk])state.completedTasks[tk]={};
  if(!state.dailyPenalties[tk])state.dailyPenalties[tk]=[];
  if(!state.shopHistory[tk])state.shopHistory[tk]={};
  // Initialize app
  updateCoinDisplay();
  renderAllPages();
  renderPetPage();
  saveState();
}

// ============================================================
// PWA SERVICE WORKER
// ============================================================
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  });
}

// ============================================================
// START
// ============================================================
init();
</script>
