<!DOCTYPE html><html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>小六一的闯关日记</title>
<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="闯关日记">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="闯关日记">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--c1:#FF6B6B;--c2:#4ECDC4;--c3:#FFE66D;--c4:#95E1D3;--c5:#F38181;--c6:#AA96DA;--c7:#FCBAD3;--c8:#A8D8EA;--bg:linear-gradient(135deg,#E8F4FD,#FFF8E7,#F3E5F5);--card:#fff;--shadow:0 3px 12px rgba(0,0,0,.07);--radius:18px}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:var(--bg);min-height:100vh;color:#333;overflow-x:hidden}

/* Header */
.header{background:linear-gradient(135deg,#667eea,#764ba2);padding:16px 24px;border-radius:0 0 28px 28px;box-shadow:0 4px 20px rgba(102,126,234,.35);position:relative;overflow:hidden}
.header::after{content:'';position:absolute;top:-50%;right:-20%;width:200px;height:200px;background:rgba(255,255,255,.06);border-radius:50%}
.header-inner{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;max-width:1000px;margin:0 auto}
.header h1{font-size:24px;color:#fff;text-shadow:2px 2px 4px rgba(0,0,0,.12)}.header .date{font-size:13px;color:rgba(255,255,255,.85)}.star-box{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);padding:10px 20px;border-radius:20px;border:2px solid rgba(255,255,255,.25)}.star-box .big-star{font-size:30px;animation:pulse 1.8s ease-in-out infinite}.star-box .cnt{font-size:28px;font-weight:bold;color:#FFE66D}.star-box .lbl{font-size:12px;color:rgba(255,255,255,.8);margin-left:4px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2) rotate(8deg)}}

/* Progress */
.prog-wrap{max-width:1000px;margin:16px auto;padding:0 16px}
.prog-bar{background:#fff;border-radius:40px;height:32px;overflow:hidden;position:relative;box-shadow:var(--shadow)}
.prog-fill{height:100%;background:linear-gradient(90deg,#66BB6A,#43A047,#66BB6A);background-size:200% 100%;border-radius:40px;transition:width .5s ease;animation:shimmer 3s linear infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.prog-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:14px;font-weight:bold;color:#333;white-space:nowrap}

/* Journey Map */
.journey-wrap{max-width:1000px;margin:0 auto 16px;padding:0 16px}
.journey{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:12px 16px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);justify-content:center;flex-wrap:wrap}
.j-node{display:flex;align-items:center;gap:4px}
.j-dot{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:#f0f0f0;transition:all .3s}
.j-dot.done{background:#66BB6A;color:#fff;box-shadow:0 2px 8px rgba(102,187,106,.4)}
.j-dot.current{background:#FFA726;color:#fff;animation:pulse 1.5s ease-in-out infinite;box-shadow:0 2px 12px rgba(255,167,38,.5)}
.j-line{width:20px;height:3px;border-radius:2px;background:#e0e0e0}.j-line.done{background:#66BB6A}
.j-label{font-size:11px;text-align:center;color:#888;max-width:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.j-label.done{color:#66BB6A;font-weight:bold}

/* Section */
.section{max-width:1000px;margin:0 auto 20px;padding:0 16px}
.sec-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}.sec-icon{font-size:26px}.sec-title{font-size:18px;font-weight:bold}.sec-tag{font-size:12px;color:#888;margin-left:auto;background:#f5f5f5;padding:4px 12px;border-radius:12px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);transition:all .3s;border:3px solid transparent;cursor:pointer;position:relative;overflow:hidden}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.card.done{border-color:#66BB6A;background:linear-gradient(135deg,#E8F5E9,#fff)}.card.done::after{content:'✅';position:absolute;top:10px;right:14px;font-size:28px;opacity:.35}
.card-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}.c-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex-shrink:0}.c-info h3{font-size:16px;font-weight:bold}.c-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}.c-tag{font-size:11px;padding:2px 8px;border-radius:10px;background:#f0f0f0;color:#666}.c-tag.t1{background:#E3F2FD;color:#1565C0}.c-tag.t2{background:#FFF3E0;color:#E65100}.c-detail{font-size:12px;color:#777;line-height:1.5;margin-bottom:10px}.c-sub{font-size:11px;color:#aaa;margin-bottom:10px}
.c-btn{width:100%;padding:10px;border:none;border-radius:12px;font-size:14px;font-weight:bold;cursor:pointer;font-family:inherit;transition:all .3s}.c-btn.go{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}.c-btn.go:hover{transform:scale(1.03);box-shadow:0 4px 12px rgba(102,126,234,.4)}.c-btn.done-btn{background:#66BB6A;color:#fff}.c-btn.redo{background:#e0e0e0;color:#666}.c-btn.locked{background:#ccc;color:#999;cursor:not-allowed}

/* Colors */
.c-blue{background:linear-gradient(135deg,#42A5F5,#1E88E5)}.c-orange{background:linear-gradient(135deg,#FFA726,#FB8C00)}.c-purple{background:linear-gradient(135deg,#AB47BC,#8E24AA)}.c-green{background:linear-gradient(135deg,#66BB6A,#43A047)}.c-teal{background:linear-gradient(135deg,#26C6DA,#00ACC1)}.c-pink{background:linear-gradient(135deg,#EC407A,#D81B60)}.c-indigo{background:linear-gradient(135deg,#5C6BC0,#3949AB)}.c-amber{background:linear-gradient(135deg,#FFD54F,#FFB300)}

/* Game Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:100;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:24px;width:92vw;max-width:520px;max-height:85vh;overflow-y:auto;padding:24px;position:relative;animation:bounceIn .35s ease}
@keyframes bounceIn{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.modal-close{position:absolute;top:12px;right:16px;width:32px;height:32px;border-radius:50%;border:none;background:#f0f0f0;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.modal-title{font-size:20px;font-weight:bold;text-align:center;margin-bottom:16px}
.modal-score{text-align:center;margin:12px 0;font-size:15px;color:#666}
.modal-btn{display:block;margin:20px auto 0;padding:12px 36px;border:none;border-radius:24px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit}
.modal-btn.green{background:linear-gradient(135deg,#66BB6A,#43A047)}

/* Character Learning */
.char-card{border:2px solid #e0e0e0;border-radius:20px;padding:30px;text-align:center;margin-bottom:16px;transition:all .3s}
.char-big{font-size:72px;font-weight:bold;color:#333;margin-bottom:8px;cursor:pointer}.char-big:active{transform:scale(.95)}
.char-pinyin{font-size:28px;color:#667eea;margin-bottom:4px}.char-word{font-size:18px;color:#888;margin-bottom:4px}.char-emoji{font-size:48px}
.speaker-btn{background:none;border:none;font-size:24px;cursor:pointer;padding:6px 12px;border-radius:12px;background:#f0f0f0;margin-top:8px;transition:all .3s}.speaker-btn:hover{background:#e0e0e0;transform:scale(1.08)}
#engBigSpeaker{animation:speakerPulse 2s ease-in-out infinite;display:inline-block}
@keyframes speakerPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.char-pager{display:flex;justify-content:center;gap:8px;margin:12px 0;flex-wrap:wrap}.char-dot{width:10px;height:10px;border-radius:50%;background:#ddd;transition:all .3s}.char-dot.active{background:#667eea;width:24px;border-radius:6px}
.char-quiz-option{display:inline-block;width:64px;height:64px;border:3px solid #e0e0e0;border-radius:16px;margin:8px;font-size:32px;cursor:pointer;background:#fff;display:inline-flex;align-items:center;justify-content:center;transition:all .2s}.char-quiz-option:hover{transform:scale(1.1);border-color:#667eea}.char-quiz-option.correct{border-color:#66BB6A;background:#E8F5E9}.char-quiz-option.wrong{border-color:#FF6B6B;background:#FFEBEE;animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* Math */
.math-prob{text-align:center;padding:24px 0}.math-equation{font-size:48px;font-weight:bold;margin-bottom:8px}.math-visual{font-size:24px;margin-bottom:16px;color:#888;min-height:32px}.math-input{font-size:36px;font-weight:bold;width:120px;text-align:center;border:3px solid #ddd;border-radius:16px;padding:8px 0;margin:0 auto 16px;display:block;outline:none;font-family:inherit}.math-input:focus{border-color:#667eea}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:0 auto}.numpad button{aspect-ratio:1;border:none;border-radius:14px;font-size:22px;font-weight:bold;background:#f5f5f5;cursor:pointer;transition:all .15s;font-family:inherit}.numpad button:hover{background:#e0e0e0;transform:scale(1.05)}.numpad button:active{transform:scale(.95)}.numpad .num-ok{background:linear-gradient(135deg,#66BB6A,#43A047);color:#fff}.numpad .num-del{background:#FF6B6B;color:#fff;font-size:16px}
.math-feedback{text-align:center;margin-top:10px;font-size:24px;min-height:36px}

/* Go Board */
.go-wrap{text-align:center}
.go-instruction{font-size:15px;color:#666;margin-bottom:12px}.go-instruction b{color:#333}
.go-board{display:inline-grid;background:#5D4037;gap:1.5px;padding:1.5px;border-radius:8px;margin:0 auto 12px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.go-cell{width:40px;height:40px;background:#DEB887;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.go-cell:hover{background:#cda073}.go-cell.hint{background:#FFE082;animation:pulse .8s ease-in-out infinite}
.go-stone{width:30px;height:30px;border-radius:50%}.go-stone.b{background:radial-gradient(circle at 35% 35%,#555,#000);box-shadow:2px 2px 5px rgba(0,0,0,.4)}.go-stone.w{background:radial-gradient(circle at 35% 35%,#fff,#ccc);box-shadow:2px 2px 5px rgba(0,0,0,.2);border:1px solid #aaa}.go-stone.new-w{animation:popIn .4s ease}
@keyframes popIn{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.go-feedback{font-size:18px;font-weight:bold;min-height:28px;margin:8px 0}.go-feedback.ok{color:#66BB6A}.go-feedback.ng{color:#FF6B6B}
.go-score{font-size:14px;color:#888;margin-bottom:8px}

/* Parent Panel */
.parent-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center}
.parent-overlay.show{display:flex}
.parent-panel{background:#fff;border-radius:20px;width:94vw;max-width:650px;max-height:88vh;overflow-y:auto;padding:24px;animation:bounceIn .35s ease}
.parent-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;border-bottom:2px solid #eee;padding-bottom:10px}
.ptab{padding:8px 14px;border:none;border-radius:10px 10px 0 0;background:none;cursor:pointer;font-size:13px;font-weight:bold;color:#888;font-family:inherit;transition:all .2s}.ptab:hover{color:#333}.ptab.active{background:#f5f5f5;color:#667eea}
.ptab-content{display:none}.ptab-content.active{display:block}
.p-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f5f5f5;gap:10px;flex-wrap:wrap}
.p-row label{font-size:14px;font-weight:bold;min-width:80px}.p-row input,.p-row select,.p-row textarea{border:2px solid #ddd;border-radius:10px;padding:8px 12px;font-size:14px;font-family:inherit;flex:1;min-width:120px}.p-row input:focus,.p-row select:focus,.p-row textarea:focus{border-color:#667eea;outline:none}
.p-row textarea{height:60px;resize:vertical}.p-row .toggle{width:52px;height:28px;border-radius:14px;border:none;cursor:pointer;position:relative;transition:all .3s}.p-row .toggle.on{background:#66BB6A}.p-row .toggle.off{background:#ccc}.p-row .toggle::after{content:'';position:absolute;top:4px;width:20px;height:20px;border-radius:50%;background:#fff;transition:all .3s}.p-row .toggle.on::after{left:28px}.p-row .toggle.off::after{left:4px}
.p-row .slider{width:100%;accent-color:#667eea}
.p-save{margin-top:16px;padding:10px 24px;border:none;border-radius:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:14px;font-weight:bold;cursor:pointer;font-family:inherit}
.p-danger{background:#FF6B6B!important;margin-left:8px}
.gear-btn{position:fixed;bottom:20px;right:20px;width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.9);box-shadow:0 3px 12px rgba(0,0,0,.15);font-size:24px;cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center;transition:all .3s}.gear-btn:hover{transform:scale(1.1)}

/* Rewards + Weekly */
.reward-wrap,.weekly-wrap{max-width:1000px;margin:0 auto 20px;padding:0 16px}
.rew-card,.week-card{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.rew-title,.week-title{font-size:16px;font-weight:bold;margin-bottom:12px}
.rew-tiers{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.rew-tier{background:#fafafa;border-radius:14px;padding:14px 18px;text-align:center;min-width:100px;flex:1;transition:all .3s}.rew-tier.achieved{border:2px solid #66BB6A;background:#E8F5E9}.rew-tier .tier-stars{font-size:20px;margin-bottom:4px}.rew-tier .tier-name{font-size:13px;font-weight:bold}.rew-tier .tier-desc{font-size:11px;color:#888;margin-top:2px}
.rew-monthly{flex:1 1 100%;background:linear-gradient(135deg,#FFF8E1,#FFECB3);border:2px dashed #FFB300;border-radius:14px;padding:16px 20px;text-align:center;transition:all .4s;position:relative;overflow:hidden}
.rew-monthly.upcoming{background:linear-gradient(135deg,#f9f9f9,#e8e8e8);border-color:#ccc;opacity:.7}
.rew-monthly.achieved{background:linear-gradient(135deg,#FFE082,#FFD54F)!important;border:3px solid #FF8F00!important;box-shadow:0 0 24px rgba(255,143,0,.4);animation:monthlyGlow 2s ease-in-out infinite}
@keyframes monthlyGlow{0%,100%{box-shadow:0 0 16px rgba(255,143,0,.3)}50%{box-shadow:0 0 32px rgba(255,143,0,.6)}}
.rew-monthly .rm-emoji{font-size:36px;margin-bottom:4px}
.rew-monthly .rm-title{font-size:15px;font-weight:bold;color:#E65100}
.rew-monthly.upcoming .rm-title{color:#999}
.rew-monthly.achieved .rm-title{color:#E65100;font-size:18px}
.rew-monthly .rm-desc{font-size:12px;color:#888;margin:4px 0}
.rew-monthly .rm-bar-wrap{background:#e0e0e0;border-radius:10px;height:10px;max-width:300px;margin:8px auto;overflow:hidden}
.rew-monthly .rm-bar-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,#FFB300,#FF8F00);transition:width .6s ease}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center}.week-day{padding:10px 4px;border-radius:12px;background:#fafafa}.week-day.today{background:#E3F2FD;border:2px solid #42A5F5}.week-day .wname{font-size:11px;color:#999}.week-day .wdate{font-size:14px;font-weight:bold;margin:4px 0}.week-day .wstars{font-size:16px}

/* Floating star + confetti */
.fstar{position:fixed;font-size:36px;pointer-events:none;z-index:9999;animation:flyUp 1.1s ease-out forwards}
@keyframes flyUp{0%{opacity:1;transform:scale(.4) translateY(0)}30%{opacity:1;transform:scale(1.6) translateY(-25px)}100%{opacity:0;transform:scale(1) translateY(-100px)}}

/* Celebration */
.cel-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:300;align-items:center;justify-content:center}
.cel-overlay.show{display:flex}
.cel-card{background:#fff;border-radius:28px;padding:36px 44px;text-align:center;max-width:380px;animation:bounceIn .5s ease}.cel-card .emoji{font-size:64px;margin-bottom:10px;animation:celebrate .5s ease .2s 2}@keyframes celebrate{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-12deg) scale(1.2)}75%{transform:rotate(12deg) scale(1.2)}}.cel-card h2{font-size:22px;color:#FF6F00;margin-bottom:6px}.cel-card p{font-size:15px;color:#666;margin-bottom:16px}.cel-card button{padding:10px 32px;border:none;border-radius:20px;background:linear-gradient(135deg,#FFE66D,#FFA726);color:#fff;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit}

/* Responsive */
@media(max-width:768px){
  .header h1{font-size:18px}.header{padding:12px 16px;border-radius:0 0 20px 20px}
  .header-inner{gap:8px}
  .card-grid{grid-template-columns:1fr}
  .go-cell{width:32px;height:32px}.go-stone{width:24px;height:24px}
  .char-big{font-size:56px}.math-equation{font-size:36px}
  .week-grid{grid-template-columns:repeat(4,1fr)}
  .star-box{padding:8px 14px}
  .star-box .big-star{font-size:24px}
  .star-box .cnt{font-size:22px}
  .rew-tiers{flex-direction:column}
  .modal-box{width:96vw;padding:18px;max-height:90vh}
  .journey{gap:3px;padding:8px}
  .j-dot{width:28px;height:28px;font-size:14px}
  .j-line{width:14px}
  .j-label{font-size:10px;max-width:32px}
}
@media(min-width:768px) and (max-width:1024px){
  .card-grid{grid-template-columns:repeat(2,1fr)}
  .header h1{font-size:22px}
}
/* iPad landscape */
@media(min-width:1024px){
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
}
/* Safe area for notch devices */
@supports(padding:max(0px)){
  .header{padding-top:max(16px,env(safe-area-inset-top))}
  .gear-btn{bottom:max(20px,env(safe-area-inset-bottom,20px))}
  body{padding-bottom:env(safe-area-inset-bottom)}
}

/* PWA Install Banner */
.pwa-banner{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;z-index:250;padding:16px 20px;box-shadow:0 -2px 16px rgba(0,0,0,.12);border-radius:20px 20px 0 0;animation:slideUp .4s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.pwa-banner.show{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.pwa-banner .pb-icon{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.pwa-banner .pb-text{flex:1;min-width:160px}.pb-text strong{display:block;font-size:15px}.pb-text span{font-size:12px;color:#888}
.pwa-banner .pb-btn{padding:10px 20px;border:none;border-radius:20px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:14px;font-weight:bold;cursor:pointer;font-family:inherit}.pwa-banner .pb-close{background:none;border:none;font-size:20px;cursor:pointer;padding:4px 8px;color:#999}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header"><div class="header-inner">
<div><h1>🦁 小六一的闯关日记</h1><div class="date" id="d"></div></div>
<div class="star-box"><span class="big-star">⭐</span><span class="cnt" id="sc">0</span><span class="lbl">能量星</span></div>
</div></header>

<!-- PROGRESS -->
<div class="prog-wrap"><div class="prog-bar"><div class="prog-fill" id="pf" style="width:0%"></div><div class="prog-text" id="pt">闯关进度 0/8</div></div></div>

<!-- JOURNEY MAP -->
<div class="journey-wrap"><div class="journey" id="journey"></div></div>

<!-- TASKS -->
<main id="main"></main>

<!-- REWARDS -->
<div class="reward-wrap"><div class="rew-card"><div class="rew-title">🏆 星星奖励站</div><div class="rew-tiers" id="rewards"></div></div></div>

<!-- WEEKLY -->
<div class="weekly-wrap"><div class="week-card"><div class="week-title">📅 本周能量星</div><div class="week-grid" id="weekly"></div></div></div>

<!-- GAME MODAL -->
<div class="modal-overlay" id="gmo"><div class="modal-box" id="gmc"></div></div>

<!-- PARENT OVERLAY -->

function tk(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function gs(k,d){let v=localStorage.getItem(k);return v?JSON.parse(v):d}
function ss(k,v){localStorage.setItem(k,JSON.stringify(v))}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// MONTHLY PERFECT TRACKING (August 2026)
// ============================================================
function computeMonthlyPerfect(){
  const year=2026,month=8,daysInMonth=31;
  const settings=getSettings();
  const enabledTasks=settings.tasks.filter(t=>t.enabled);
  let perfectDays=0,totalElapsed=0;
  const today=new Date();
  for(let d=1;d<=daysInMonth;d++){
    const key=year+'-'+String(month).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const dateObj=new Date(year,month-1,d);
    if(dateObj>today)break;
    totalElapsed++;
    const taskState=gs('taskState_'+key,{});
    if(taskState&&Object.keys(taskState).length>0&&enabledTasks.every(t=>taskState[t.id]))perfectDays++;
  }
  const monthKey=year+'-0'+month;
  const existingAchievements=gs('monthlyAchievements',{});
  const achieved=totalElapsed>=daysInMonth&&perfectDays>=daysInMonth;
  if(achieved&&!existingAchievements[monthKey]){
    existingAchievements[monthKey]={achieved:true,achievedDate:tk()};
    ss('monthlyAchievements',existingAchievements);
  }
  const alreadyAchieved=!!(existingAchievements[monthKey]&&existingAchievements[monthKey].achieved);
  return{
    perfectDays,totalDays:daysInMonth,elapsedDays:totalElapsed,
    achieved:achieved||alreadyAchieved,
    monthStarted:today>=new Date(year,month-1,1)
  };
}

function renderWeekly(todayStars){
const weekData=gs('weekStars',{});

const wns=['日','一','二','三','四','五','六'];
const todayKey=tk();
let wh='';
for(let i=0;i<7;i++){const d=new Date(sunday);d.setDate(sunday.getDate()+i);
const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const s=weekData[key]||0;const isToday=key===todayKey;
wh+=`<div class="week-day ${isToday?'today':''}"><div class="wname">周${wns[i]}</div><div class="wdate">${d.getMonth()+1}/${d.getDate()}</div><div class="wstars">${s>0?'⭐'.repeat(Math.min(s,5))+(s>5?'+'+s:''):'○'}</div></div>`;}

// update today's stars in weekly
weekData[todayKey]=todayStars;ss('weekStars',weekData);
}

const state=gs('taskState_'+tk(),{});

}

const state=gs('taskState_'+tk(),{});
state[id]=false;ss('taskState_'+tk(),state);renderAll();
}

let charState={idx:0,mode:'learn',quizChars:[],qIdx:0,correct:0,total:0};

function openCharModule(taskId){
const s=getSettings();
const dayIdx=s.char.dayIndex||0;
const countPerDay=s.char.countPerDay||5;
let chars=[];
for(let d=0;d<dailySets.length&&chars.length<countPerDay;d++){
const di=(dayIdx+d)%dailySets.length;
for(const ci of dailySets[di]){if(chars.length>=countPerDay)break;chars.push(ci);}
}
charState={idx:0,mode:'learn',quizChars:chars,qIdx:0,correct:0,total:chars.length,taskId:taskId,dayIdx:dayIdx};
renderCharModal();
}

let mathState={idx:0,correct:0,total:0,probs:[],taskId:'',input:'',feedback:''};

function openMathModule(taskId){
const s=getSettings();const d=s.math.difficulty||'add10';const cnt=s.math.count||10;
const probs=[];
for(let i=0;i<cnt;i++){
let a,b,op,ans;
if(d==='add10'){a=Math.floor(Math.random()*10)+1;b=Math.floor(Math.random()*(10-a))+1;op='+';ans=a+b;}
else if(d==='sub10'){b=Math.floor(Math.random()*10)+1;a=b+Math.floor(Math.random()*(10-b))+1;op='-';ans=a-b;}
else if(d==='add20'){a=Math.floor(Math.random()*19)+1;b=Math.floor(Math.random()*Math.min(20-a,19))+1;op='+';ans=a+b;if(a+b>20){a=Math.floor(Math.random()*10)+1;b=Math.floor(Math.random()*10)+1;ans=a+b;}}
else if(d==='sub20'){ans=Math.floor(Math.random()*19)+1;b=Math.floor(Math.random()*(ans))+1;a=ans+b;op='-';if(a>20){ans=Math.floor(Math.random()*10)+1;b=Math.floor(Math.random()*ans)+1;a=ans+b;}}
else{const r=Math.random();if(r<.5){a=Math.floor(Math.random()*19)+1;b=Math.floor(Math.random()*Math.min(20-a,19))+1;op='+';ans=a+b;if(a+b>20){a=Math.floor(Math.random()*10)+1;b=Math.floor(Math.random()*10)+1;ans=a+b;}}else{ans=Math.floor(Math.random()*19)+1;b=Math.floor(Math.random()*ans)+1;a=ans+b;op='-';if(a>20){ans=Math.floor(Math.random()*10)+1;b=Math.floor(Math.random()*ans)+1;a=ans+b;}}}
probs.push({a,b,op,ans});
}
mathState={idx:0,correct:0,total:cnt,probs,taskId,input:'',feedback:''};
renderMathModal();
}

function renderMathModal(){
const s=mathState;const p=s.probs[s.idx];
const fruits=['🍎','🍌','🍇','🍓'];
const f1=fruits[s.idx%4];const f2=fruits[(s.idx+1)%4];
const visA=p.a<=10?(f1+' ').repeat(p.a):'●●●'.repeat(Math.floor(p.a/3))+(p.a%3>0?'●'.repeat(p.a%3):'');
const visB=p.b<=10?(f2+' ').repeat(p.b):'●●'.repeat(Math.floor(p.b/3))+(p.b%3>0?'●'.repeat(p.b%3):'');
const vis=visA.length<40?visA+' '+p.op+' '+visB+' = ?':'';
let html=`<button class="modal-close" onclick="closeGameModal()">✕</button>
<div class="modal-title">🧮 数学大冒险 · ${s.idx+1}/${s.total}题</div>
<div class="math-prob">
<div class="math-equation">${p.a} ${p.op} ${p.b} = <span style="color:#667eea;">?</span></div>`;
if(vis)html+=`<div class="math-visual">${vis}</div>`;
html+=`<input type="text" class="math-input" id="mathInput" value="${s.input}" inputmode="numeric" pattern="[0-9]*" oninput="mathState.input=this.value" onkeydown="if(event.key==='Enter')mathSubmit()" maxlength="2" autofocus>
<div class="math-feedback" id="mathFb">${s.feedback}</div>
<div class="numpad">`;
for(let i=1;i<=9;i++)html+=`<button onclick="mathTap(${i})">${i}</button>`;
html+=`<button class="num-del" onclick="mathTap('del')">⌫</button><button onclick="mathTap(0)">0</button><button class="num-ok" onclick="mathSubmit()">✔</button></div></div>`;
if(s.idx>0)html+=`<div class="modal-score">已答对 ${s.correct}/${s.idx} 题</div>`;
document.getElementById('gmc').innerHTML=html;
document.getElementById('gmo').classList.add('show');
setTimeout(()=>{const inp=document.getElementById('mathInput');if(inp)inp.focus();},100);
}

function mathTap(v){
if(v==='del'){mathState.input=mathState.input.slice(0,-1);}
else{mathState.input+=String(v);}
renderMathModal();
if(document.getElementById('mathInput')){
document.getElementById('mathInput').value=mathState.input;
}
}

function mathSubmit(){
const s=mathState;const p=s.probs[s.idx];
const userAns=parseInt(s.input);
if(isNaN(userAns)){s.feedback='❌ 请输入数字';s.input='';renderMathModal();return;}
if(userAns===p.ans){
s.correct++;s.feedback='✅ 回答正确！太棒了！';s.input='';
renderMathModal();
setTimeout(()=>{s.feedback='';s.idx++;if(s.idx>=s.total)finishMath();else renderMathModal();},500);
}else{
s.feedback='❌ 答错了，正确答案是 '+p.ans;s.input='';
renderMathModal();
setTimeout(()=>{s.feedback='';s.idx++;if(s.idx>=s.total)finishMath();else renderMathModal();},800);
}
}

function finishMath(){
const s=mathState;closeGameModal();finishTask(s.taskId);showCelebration('🎉','数学闯关完成！',s.total+' 道题，答对 '+s.correct+' 题！');
}

// THINKING MODULE (Pattern / Odd-One-Out / Counting / Compare)
// ============================================================
let thinkState={idx:0,correct:0,total:0,questions:[],taskId:'',feedback:''};

function genThinkQuestions(cnt){
  const qs=[];
  const types=['pattern','odd','count','compare'];
  for(let i=0;i<cnt;i++){
    const t=types[i%types.length];
    if(t==='pattern')qs.push(genPatternQ());
    else if(t==='odd')qs.push(genOddQ());
    else if(t==='count')qs.push(genCountQ());
    else qs.push(genCompareQ());
  }
  return shuffle(qs);
}

function genPatternQ(){
  const patterns=[
    {seq:['🍎','🍌','🍎','🍌'],ans:'🍎',opts:['🍎','🍌','🍇','🍓'],hint:'水果排队：苹果→香蕉→苹果→香蕉→？'},
    {seq:['🔴','🔵','🔴','🔵'],ans:'🔴',opts:['🔴','🔵','🟡','🟢'],hint:'彩色珠子排队：红→蓝→红→蓝→？'},
    {seq:['⭐','🌟','⭐','🌟'],ans:'⭐',opts:['⭐','🌟','✨','💫'],hint:'星星排队：小星→大星→小星→大星→？'},
    {seq:['🐶','🐱','🐶','🐱'],ans:'🐶',opts:['🐶','🐱','🐰','🐹'],hint:'小动物排队：小狗→小猫→小狗→小猫→？'},
    {seq:['1️⃣','2️⃣','1️⃣','2️⃣'],ans:'1️⃣',opts:['1️⃣','2️⃣','3️⃣','4️⃣'],hint:'数字排队：1→2→1→2→？'},
    {seq:['⚪','⚫','⚪','⚫'],ans:'⚪',opts:['⚪','⚫','🔘','⬜'],hint:'颜色排队：白→黑→白→黑→？'},
    {seq:['🌸','🌿','🌸','🌿'],ans:'🌸',opts:['🌸','🌿','🌺','🍀'],hint:'花朵排队：花→叶→花→叶→？'},
    {seq:['🚗','🚌','🚗','🚌'],ans:'🚗',opts:['🚗','🚌','🚲','✈️'],hint:'车辆排队：小车→公交→小车→公交→？'}
  ];
  return {type:'pattern',...patterns[Math.floor(Math.random()*patterns.length)]};
}

function genOddQ(){
  const groups=[
    {items:['🍎','🍌','🐶','🍇'],odd:2,reason:'🐶 不是水果哦'},
    {items:['🚗','🚌','🍎','🚲'],odd:2,reason:'🍎 不是交通工具'},
    {items:['👀','👂','🍎','👃'],odd:2,reason:'🍎 不是五官'},
    {items:['🐶','🐱','🐰','🚗'],odd:3,reason:'🚗 不是小动物'},
    {items:['🔴','🔵','🟡','📱'],odd:3,reason:'📱 不是颜色'},
    {items:['🍎','🍌','🍇','🥕'],odd:3,reason:'🥕 是蔬菜不是水果'},
    {items:['🐦','🦋','✈️','🐝'],odd:2,reason:'✈️ 不是会飞的动物'},
    {items:['👟','🧦','👒','👞'],odd:2,reason:'👒 是帽子不是穿的'}
  ];
  return {type:'odd',...groups[Math.floor(Math.random()*groups.length)]};
}

function genCountQ(){
  const emojis=['🍎','⭐','🐶','🌸','🚗','🔴','🐱','🍌'];
  const em=emojis[Math.floor(Math.random()*emojis.length)];
  const n=2+Math.floor(Math.random()*7); // 2-8
  const correct=n;
  let opts=[correct,correct+1,correct-1,correct+2].filter(x=>x>=1&&x<=9);
  while(opts.length<4){opts.push(Math.floor(Math.random()*8)+1);}
  opts=[...new Set(opts)].slice(0,4);
  opts=shuffle(opts);
  return {type:'count',emojis:Array(n).fill(em),ans:correct,opts,hint:'数一数有几个'+em+'？'};
}

function genCompareQ(){
  const pairs=[
    {a:'🐘',b:'🐭',q:'哪个更大？',ans:0,al:'大象',bl:'老鼠'},
    {a:'🐭',b:'🐘',q:'哪个更小？',ans:0,al:'老鼠',bl:'大象'},
    {a:'🦒',b:'🐶',q:'哪个更高？',ans:0,al:'长颈鹿',bl:'小狗'},
    {a:'🐢',b:'🐇',q:'哪个更慢？',ans:0,al:'乌龟',bl:'兔子'},
    {a:'🐇',b:'🐢',q:'哪个更快？',ans:0,al:'兔子',bl:'乌龟'},
    {a:'🏠',b:'🏢',q:'哪个更高？',ans:1,al:'房子',bl:'高楼'},
    {a:'🍎',b:'🍉',q:'哪个更大？',ans:1,al:'苹果',bl:'西瓜'},
    {a:'🐳',b:'🐟',q:'哪个更大？',ans:0,al:'鲸鱼',bl:'小鱼'},
    {a:'5️⃣',b:'3️⃣',q:'哪个更多？',ans:0,al:'5',bl:'3'},
    {a:'2️⃣',b:'8️⃣',q:'哪个更多？',ans:1,al:'2',bl:'8'}
  ];
  return {type:'compare',...pairs[Math.floor(Math.random()*pairs.length)]};
}

function openThinkModule(taskId){
  const s=getSettings();const cnt=s.thinking?s.thinking.count:8;
  const qs=genThinkQuestions(cnt);
  thinkState={idx:0,correct:0,total:cnt,questions:qs,taskId,feedback:''};

let goState={idx:0,correct:0,total:0,probs:[],taskId:'',board:[],size:7,answer:null,tries:0,feedback:'',showHint:false};

function generateGoProblem(diff){
const size=7;const board=Array(size).fill(null).map(()=>Array(size).fill(0));
let cx,cy;
if(diff===1){cx=Math.random()<.5?0:size-1;cy=Math.random()<.5?0:size-1;} // corner
else if(diff===2){ // edge
if(Math.random()<.5){cx=Math.random()<.5?0:size-1;cy=1+Math.floor(Math.random()*(size-2));}
else{cy=Math.random()<.5?0:size-1;cx=1+Math.floor(Math.random()*(size-2));}
}else{cx=2+Math.floor(Math.random()*3);cy=2+Math.floor(Math.random()*3);} // center
board[cy][cx]=1; // black
const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
const neighbors=[];
for(const[dr,dc]of dirs){const r=cy+dr,c=cx+dc;if(r>=0&&r<size&&c>=0&&c<size)neighbors.push([r,c]);}
const ai=Math.floor(Math.random()*neighbors.length);
const answer=neighbors[ai];
for(let i=0;i<neighbors.length;i++){if(i!==ai)board[neighbors[i][0]][neighbors[i][1]]=2;}
return{board,answer,size};
}

function openGoModule(taskId){
const s=getSettings();const diff=s.go.difficulty||1;const cnt=s.go.count||5;
const probs=[];for(let i=0;i<cnt;i++)probs.push(generateGoProblem(diff));
goState={idx:0,correct:0,total:cnt,probs,taskId,board:probs[0].board,size:probs[0].size,answer:probs[0].answer,tries:0,feedback:'',showHint:false};
renderGoModal();
}

function renderGoModal(){
const s=goState;const p=s.probs[s.idx];s.board=p.board;s.answer=p.answer;s.size=p.size;
let html=`<button class="modal-close" onclick="closeGameModal()">✕</button>
<div class="modal-title">⚫ 围棋吃子练习 · 第${s.idx+1}/${s.total}关</div>
<div class="go-wrap">
<div class="go-instruction"><b>黑子</b>只剩最后一口气了，<br>点击正确位置放白子吃掉它！</div>
<div class="go-board" style="grid-template-columns:repeat(${s.size},36px);grid-template-rows:repeat(${s.size},36px)">`;
for(let r=0;r<s.size;r++){
for(let c=0;c<s.size;c++){
const v=p.board[r][c];
const isHint=s.showHint&&r===p.answer[0]&&c===p.answer[1];
html+=`<div class="go-cell ${isHint?'hint':''}" onclick="goClick(${r},${c})">`;
if(v===1)html+=`<div class="go-stone b"></div>`;
else if(v===2)html+=`<div class="go-stone w"></div>`;
html+=`</div>`;
}
}
html+=`</div>
<div class="go-feedback" id="goFb">${s.feedback}</div>`;
if(s.tries>=3&&!s.showHint)html+=`<div style="text-align:center;margin-bottom:8px"><button class="modal-btn" style="background:#FFA726;font-size:14px;padding:8px 20px" onclick="goShowHint()">💡 给我提示</button></div>`;
html+=`<div class="go-score">已吃掉 ${s.correct}/${s.idx} 块黑子</div>
</div>`;
document.getElementById('gmc').innerHTML=html;
document.getElementById('gmo').classList.add('show');
}

function goClick(r,c){
const s=goState;const p=s.probs[s.idx];
if(p.board[r][c]!==0)return;
if(r===p.answer[0]&&c===p.answer[1]){
p.board[r][c]=2;s.correct++;s.tries=0;s.showHint=false;s.feedback='🎉 正确！吃掉黑子！';renderGoModal();
setTimeout(()=>{s.feedback='';s.idx++;if(s.idx>=s.total)finishGo();else renderGoModal();},600);
}else{
s.tries++;if(s.tries>=3){s.showHint=true}s.feedback='❌ 这个位置不能吃子，再想想~';renderGoModal();
}
}

function goShowHint(){goState.showHint=true;renderGoModal();}

function finishGo(){const s=goState;closeGameModal();finishTask(s.taskId);showCelebration('🎉','围棋闯关完成！','吃掉 '+s.correct+' 块黑子！');}
